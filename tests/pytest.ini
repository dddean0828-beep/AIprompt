[pytest]
; ============================================================
; 测试发现配置
; ============================================================
; pytest tests/ -v  一键发现并运行所有 API + E2E 测试
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs =
    .venv
    .pytest_cache
    __pycache__
    node_modules
    reports

; ============================================================
; 标记注册
; ============================================================
markers =
    smoke: 冒烟测试（核心流程快速验证）
    slow: 慢速测试（如浏览器交互、多步骤流程）
    user: 用户模块测试（注册/登录/鉴权）
    prompt: 提示词模块测试（CRUD + 权限边界）
    favorite: 收藏模块测试
    e2e: 端到端测试（需要前端服务 + 浏览器）

; ============================================================
; 默认运行选项
; ============================================================
; -v: 详细输出
; --tb=short: 简短的错误回溯
; --strict-markers: 未注册标记引发错误
; --timeout=30: 每个测试用例 30s 超时
addopts = -v --tb=short --strict-markers --timeout=30

; ============================================================
; 超时配置
; ============================================================
; E2E 测试（浏览器启动、页面跳转）允许更长的超时时间
timeout = 30
timeout_method = signal

; ============================================================
; 警告过滤
; ============================================================
filterwarnings =
    ignore::DeprecationWarning
