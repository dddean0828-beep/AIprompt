name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:  # 允许从 GitHub UI 手动触发

jobs:
  api-tests:
    name: API Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.11"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: ai_prompt_manager
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================================
      # 2. Setup Runtimes
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ============================================================
      # 3. Install Dependencies
      # ============================================================
      - name: Install Python dependencies
        working-directory: tests
        run: pip install -r requirements.txt

      # ============================================================
      # 4. Initialize Database
      # ============================================================
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -u root -p123456 --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL... ($i/30)"
            sleep 2
          done

      - name: Initialize database schema
        run: |
          mysql -h 127.0.0.1 -u root -p123456 < backend/src/main/resources/db/init.sql

      # ============================================================
      # 5. Start Backend
      # ============================================================
      - name: Start Spring Boot backend
        run: |
          cd backend
          mvn spring-boot:run -q &
          echo "BACKEND_PID=$!" >> $GITHUB_ENV

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/prompt/list 2>/dev/null || echo "000")
            if [[ "$status" =~ ^(200|401|403|404)$ ]]; then
              echo "Backend is ready (HTTP $status)"
              break
            fi
            echo "Waiting for backend... ($i/60, HTTP $status)"
            sleep 3
          done
          # Final check
          curl -s http://localhost:8080/api/prompt/list || echo "WARNING: Backend may not be fully ready"

      # ============================================================
      # 6. Run API Tests
      # ============================================================
      - name: Run API tests
        id: api-tests
        working-directory: tests
        continue-on-error: true  # 即使测试失败也要上传报告
        run: |
          mkdir -p reports
          python -m pytest api/ -v \
            --tb=short \
            --strict-markers \
            --timeout=30 \
            --html=reports/api_report.html \
            --self-contained-html \
            --junitxml=reports/junit.xml \
            2>&1 | tee reports/api_ci.log
          echo "EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      # ============================================================
      # 7. Upload Reports
      # ============================================================
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report-py${{ matrix.python-version }}
          path: |
            tests/reports/api_report.html
            tests/reports/junit.xml
            tests/reports/api_ci.log
          retention-days: 7

      # ============================================================
      # 8. Publish Test Summary
      # ============================================================
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: API Tests (Python ${{ matrix.python-version }})
          path: tests/reports/junit.xml
          reporter: java-junit

      # ============================================================
      # 9. Stop Backend
      # ============================================================
      - name: Stop backend
        if: always()
        run: |
          if [[ -n "$BACKEND_PID" ]]; then
            kill "$BACKEND_PID" 2>/dev/null || true
          fi

      # ============================================================
      # 10. Final Status
      # ============================================================
      - name: Final status
        if: always()
        run: |
          if [[ "$EXIT_CODE" == "0" ]]; then
            echo "✅ API tests passed!"
          else
            echo "❌ API tests failed (exit=$EXIT_CODE)"
            exit 1
          fi
